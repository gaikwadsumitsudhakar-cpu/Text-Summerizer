
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #F0F6FF;
            color: #243B5A;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 15px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #FFFFFF;
            border: 1px solid #E4EBF5;
            border-radius: 22px;
            padding: 42px;
            box-shadow: 0 12px 40px rgba(38, 75, 125, 0.07);
            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #E5EFFF;
            color: #3978D7;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 30px;
        }

        h1 {
            font-size: 33px;
            font-weight: 800;
            color: #172B4D;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #74849B;
            font-size: 14px;
            line-height: 1.8;
        }

        .tag {
            display: inline-block;
            background: #EAF1FF;
            color: #3978D7;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 16px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #243B5A;
        }

        .counter {
            color: #91A1B7;
            font-size: 12px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 20px;
            border: 1px solid #DCE6F2;
            border-radius: 13px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            background: #FAFCFF;
            color: #334B68;
            transition: 0.25s;
        }

        textarea:focus {
            border-color: #6195E7;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(57,120,215,0.09);
        }

        textarea::placeholder {
            color: #9AA9BC;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            border: none;
            border-radius: 11px;
            padding: 14px 22px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        .summarize-btn {
            flex: 1;
            color: white;
            background: #3978D7;
            box-shadow: 0 5px 14px rgba(57,120,215,0.18);
        }

        .summarize-btn:hover:not(:disabled) {
            background: #2863BD;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #EEF2F8;
            color: #536982;
        }

        .clear-btn:hover {
            background: #E2EAF4;
        }

        .summary-output {
            display: none;
            margin-top: 28px;
            background: #F1F5FF;
            border: 1px solid #DCE6F9;
            border-radius: 15px;
            padding: 24px;
            animation: appear 0.4s ease;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .summary-heading {
            font-size: 17px;
            font-weight: 800;
            color: #243B5A;
        }

        .summary-text {
            font-size: 14px;
            line-height: 1.9;
            color: #536982;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .copy-btn {
            background: #FFFFFF;
            color: #3978D7;
            border: 1px solid #D6E3F6;
            padding: 9px 13px;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: #E5EFFF;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #3978D7;
            font-weight: 600;
        }

        .spinner {
            width: 19px;
            height: 19px;
            border: 3px solid #D6E3F6;
            border-top-color: #3978D7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #91A1B7;
            font-size: 12px;
        }

        @media(max-width: 600px) {
            .container { padding: 25px 18px; }
            h1 { font-size: 27px; }
            .actions { flex-direction: column; }
            .summary-header { align-items: flex-start; }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">✦</div>

        <h1>AI Text Summarizer</h1>

        <p class="subtitle">
            Turn lengthy conversations, articles and documents
            into clear and meaningful summaries.
        </p>

        <span class="tag">
            ✨ POWERED BY HUGGING FACE TRANSFORMERS
        </span>

    </div>

    <div class="section-title">
        <span>📝 Your Content</span>
        <span class="counter" id="char-count">0 characters</span>
    </div>

    <form id="summarization-form">

        <textarea
            id="dialogue-input"
            placeholder="Paste your content here and let AI do the magic..."
            required
        ></textarea>

        <div class="actions">

            <button type="submit" class="summarize-btn">
                ✨ Generate Summary
            </button>

            <button type="button" class="clear-btn" id="clear-btn">
                ↻ Clear Text
            </button>

        </div>

    </form>

    <div class="summary-output" id="summary-output">

        <div class="summary-header">

            <h3 class="summary-heading">
                📄 Your Summary
            </h3>

            <button type="button" class="copy-btn" id="copy-btn">
                📋 Copy Summary
            </button>

        </div>

        <p class="summary-text" id="summary-text"></p>

    </div>

    <div class="footer">
        Crafted with ❤️ by Sumit using Python & Hugging Face Transformers
    </div>

</div>

<script>

    const form = document.getElementById("summarization-form");
    const dialogueInput = document.getElementById("dialogue-input");
    const summaryText = document.getElementById("summary-text");
    const summaryOutput = document.getElementById("summary-output");
    const submitButton = form.querySelector("button[type='submit']");
    const charCount = document.getElementById("char-count");
    const copyButton = document.getElementById("copy-btn");

    // Character counter
    dialogueInput.addEventListener("input", () => {
        charCount.innerText =
            `${dialogueInput.value.length} characters`;
    });

    // Generate summary
    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        const dialogue = dialogueInput.value.trim();

        if (!dialogue) return;

        summaryOutput.style.display = "block";

        summaryText.innerHTML = `
            <span class="loading">
                <span class="spinner"></span>
                AI is analyzing your content...
            </span>
        `;

        submitButton.disabled = true;
        submitButton.innerText = "Processing...";

        try {

            const response = await fetch("/summarize/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ dialogue })
            });

            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }

            const data = await response.json();

            summaryText.innerText =
                data.summary || "No summary returned.";

        } catch (err) {

            summaryText.innerText =
                `Error: ${err.message}`;

        } finally {

            submitButton.disabled = false;
            submitButton.innerText = "✨ Generate Summary";

        }

    });

    // Clear input and output
    document.getElementById("clear-btn").addEventListener("click", () => {

        dialogueInput.value = "";
        summaryText.innerText = "";
        charCount.innerText = "0 characters";
        summaryOutput.style.display = "none";
        copyButton.innerText = "📋 Copy Summary";

    });

    // Copy summary
    copyButton.addEventListener("click", async () => {

        const text = summaryText.innerText;

        if (!text || text.includes("Error:")) return;

        try {

            await navigator.clipboard.writeText(text);
            copyButton.innerText = "✓ Copied!";

        } catch (err) {

            copyButton.innerText = "Copy failed";

        }

    });

</script>

</body>
</html>
